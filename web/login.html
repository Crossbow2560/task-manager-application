<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - Task Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header>
  <p><strong>Task Manager</strong></p>
  <nav aria-label="Main">
    <a href="login.html">Log in</a>
    <a href="board.html">Task board</a>
  </nav>
</header>
<main id="main">
<h1>Log in</h1>
<form action="/auth/login" method="post" novalidate>
  <label for="email">Email address</label>
  <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-hint">
  <p id="email-hint" class="hint">Use the email you registered with.</p>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <p><button type="submit">Log in</button></p>
  <p role="status" aria-live="polite" id="form-status"></p>
</form>
</main>
</body>
</html>
